{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <h1 class="text-center">{{ about.title }}</h1>

            <div class="mt-4">
                <p>{{ about.content }}</p>
            </div>

            <p class="text-muted text-center mt-5">
                Updated on {{ about.updated_on|date:"F j, Y" }}
            </p>

        </div>
    </div>
</div>

{% endblock %}
